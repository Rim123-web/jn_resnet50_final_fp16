decoder: PIL.Image.open
color_order: RGB
resize:
  width: 640
  height: 640
  interpolation: PIL bilinear
  aspect_ratio_preserved: false
  crop: none
  padding: none
pixel_scale: divide_by_255
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]
layout: HWC_to_CHW
dtype: float32
contiguous: true
batch_dimension: 1
input_shape: [1, 3, 640, 640]
